name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  DATABASE_URL: postgresql://test:test@localhost:5432/holodex_test
  JWT_SECRET: test-secret

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build --workspaces --if-present

      - run: npm run lint

      - run: npm test
